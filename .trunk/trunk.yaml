# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: rokt-trunk-plugin
      ref: main
      uri: https://github.com/ROKT/rokt-workflows
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4

# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  ignore:
    - linters: [ALL]
      paths:
        - .venv/**
  definitions:
    - name: mypy
      runtime: python
      environment:
        - name: PYTHONPATH
          value: ${workspace}/.venv/lib/python3.10/site-packages
    - name: pylint
      runtime: python
      environment:
        - name: PYTHONPATH
          value: ${workspace}/.venv/lib/python3.10/site-packages
    - name: pyright
      runtime: python
      environment:
        - name: PYTHONPATH
          value: ${workspace}/.venv/lib/python3.10/site-packages
  enabled:
    - osv-scanner@2.7.0
    - taplo@0.10.0
    - validate-actions-versions
    - codespell@2.4.3
    - flake8@7.5.0
    - gitleaks@8.30.1
    - kube-linter@0.7.2
    - mypy@2.4.1
    - pylint@4.1.3
    - pyright@1.1.414
    - semgrep@1.183.0
    - sourcery@1.46.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.4.0
    - git-diff-check
    - isort@9.0.2
    - markdownlint@0.50.0
    - prettier@3.9.10
    - ruff@0.17.3
    - trufflehog@3.99.7
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
