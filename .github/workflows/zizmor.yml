name: Zizmor Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - actions/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - actions/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Scan GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      # A finding fails this job. Pinned so Dependabot bumps of zizmor-action keep this zizmor
      # version; bump it together with the fixes its new audits ask for.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          version: 1.32.0
