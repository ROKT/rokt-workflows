name: Trunk Lint

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Run Trunk Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Diff-scoped mode posts findings as PR annotations via the Checks API.
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python environment
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: "3.10"

      - name: Load cached venv
        id: cache-dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies and setup a local virtual environment
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # check-mode is deliberately unset: the action then autodetects
      # pull_request (diff vs the base sha) on PRs and all on workflow_dispatch.
      # v2.0.0 is required -- it adds the one-shot git auth that lets the
      # diff-scoped fetch work with persist-credentials: false.
      - name: Trunk Check
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        env:
          PYTHONPATH: ${{ github.workspace }}/.venv/lib/python3.10/site-packages
